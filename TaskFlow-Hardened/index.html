<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111F" />
  <meta name="description" content="TaskFlow — Premium Enterprise SaaS Task Management Platform by MEGHARI Abderrahmane Tarek." />
  <title>TaskFlow — Premium Enterprise Task Management</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TaskFlow — Modern Enterprise Task SaaS" />
  <meta property="og:description" content="Production-grade SaaS task manager. Tasks, projects, Kanban, calendar, and analytics." />
  <meta property="og:image" content="assets/favicon.svg" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===================== AUTH SCREEN (DEMO MODE) ===================== -->
  <div id="auth-screen" hidden>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-app); padding: 20px;">
      <div class="card" style="width: 100%; max-width: 420px; padding: 32px; background: var(--bg-surface); text-align: center;">
        <div class="brand-mark" style="margin: 0 auto 16px auto; width: 44px; height: 44px; font-size: 1.2rem;">
          <svg class="ico" viewBox="0 0 24 24" style="color: #fff;"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 6px;">TaskFlow SaaS</h1>
        <p style="color: var(--color-text-secondary); font-size: 0.875rem; margin-bottom: 24px;">Signed in as <strong>MEGHARI Abderrahmane Tarek</strong> (Owner)</p>
        <button class="btn btn-primary" style="width: 100%; padding: 12px;" data-auth-action="demo-login">Launch Workspace</button>
      </div>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app">
    <!-- Left Sidebar (~250px) -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-header">
        <a href="#dashboard" class="brand-logo">
          <div class="brand-mark">
            <svg class="ico" viewBox="0 0 24 24" style="color: #fff;"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          </div>
          <span class="brand-name">TaskFlow</span>
        </a>
        <button class="btn-icon" id="sidebar-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <div class="sidebar-body">
        <!-- Main Core Section -->
        <nav class="sidebar-nav" aria-label="Core Views">
          <div class="nav-section">
            <div class="nav-section-title">CORE</div>
            
            <button class="nav-item active" data-route="dashboard">
              <svg class="ico" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
              <span>Dashboard</span>
            </button>

            <button class="nav-item" data-route="tasks">
              <svg class="ico" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
              <span>My Tasks</span>
              <span class="badge" id="badge-tasks-count">0</span>
            </button>

            <button class="nav-item" data-route="today">
              <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span>Today</span>
              <span class="badge" id="badge-today-count">0</span>
            </button>

            <button class="nav-item" data-route="upcoming">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <span>Upcoming</span>
            </button>

            <button class="nav-item" data-route="calendar">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
              <span>Calendar</span>
            </button>

            <button class="nav-item" data-route="inbox">
              <svg class="ico" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
              <span>Inbox</span>
              <span class="badge" id="badge-inbox">2</span>
            </button>
          </div>

          <!-- Workspace Section -->
          <div class="nav-section">
            <div class="nav-section-title">WORKSPACE</div>
            
            <button class="nav-item" data-route="projects">
              <svg class="ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
              <span>Projects</span>
            </button>

            <button class="nav-item" data-route="team">
              <svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5A5 5 0 0121 19"/></svg>
              <span>Team</span>
            </button>

            <button class="nav-item" data-route="favorites">
              <svg class="ico" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>Favorites</span>
            </button>

            <button class="nav-item" data-route="archived">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a2 2 0 002 2h10a2 2 0 002-2V8M10 12h4"/></svg>
              <span>Archived</span>
            </button>
          </div>
        </nav>
      </div>

      <!-- Sidebar Footer User Profile (MEGHARI Abderrahmane Tarek) -->
      <div class="sidebar-footer">
        <button class="nav-item" data-route="settings">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 003.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Settings</span>
        </button>

        <div class="user-profile-card">
          <div class="user-avatar">MA</div>
          <div class="user-details">
            <span class="user-name">MEGHARI A. Tarek</span>
            <span class="user-role">Owner</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Backdrop -->
    <div id="app-backdrop" hidden></div>

    <!-- Main Section -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon" id="menu-btn" aria-label="Open menu">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>

        <div class="topbar-search">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="global-search" placeholder="Search tasks, projects, or anything..." />
          <span class="search-kbd">⌘K</span>
        </div>

        <div class="topbar-right">
          <!-- Purple Gradient New Task Button -->
          <button class="btn btn-primary" id="quick-create-btn">
            <svg class="ico" viewBox="0 0 24 24" style="color:#fff;"><path d="M12 5v14M5 12h14"/></svg>
            <span>New Task</span>
          </button>

          <button class="btn-icon" id="theme-toggle" title="Toggle theme">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>

          <button class="btn-icon" id="notif-btn" title="Notifications">
            <svg class="ico" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          </button>

          <button type="button" class="user-avatar" aria-label="Open profile for MEGHARI Abderrahmane Tarek" style="width: 34px; height: 34px; font-size: 0.8rem;" onclick="location.hash='#profile'">MA</button>
        </div>
      </header>

      <!-- Main Content Route Container -->
      <main id="app-content" class="content-area"></main>
    </div>
  </div>

  <!-- Overlays & Toast Container -->
  <div id="overlay-root"></div>
  <div id="toast-root" style="position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px;"></div>

  <!-- Modular Scripts -->
  <script src="js/statistics.js"></script>
  <script src="script.js"></script>
</body>
</html>
